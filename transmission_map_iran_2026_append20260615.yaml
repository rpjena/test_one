    persist and the nuclear file stalls, leaving Hormuz nominally open but
    insurance and traffic not normalised. The war premium that just exited
    re-enters, so oil and gas grind higher from the anchor. Sticky energy
    keeps inflation hot and central banks hawkish, so the dollar firms and
    gold is pressured by the USD/real-rate channel rather than bid as a haven
    (empirically confirmed). Oil-importer FX and EM credit deteriorate; US
    energy HY counterintuitively compresses as higher oil supports cash flow.
