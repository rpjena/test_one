    - RBOB Gasoline (RB)
  - step: 3
    mechanism: disorderly supply shock spikes oil and equity vol
    affects:
    - OVX Oil Vol (vol pts)
    - VIX (vol pts)
    - VSTOXX (vol pts)
  - step: 4
    mechanism: global growth shock and risk-off crater equities, energy outperforming the tape
