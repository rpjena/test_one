prior_mean_convention: "All prior_mean values are changes from the 2026-06-15 anchor level (NOT pre-war). Generic instruments in %, VIX/VSTOXX in absolute vol points, rates/credit (US 10Y Yield, HY E&P, EMBI, SOFR3M, Euribor3M) in basis points."

iran_2026_rapid_resolution:
  description: >
    Signed MoU and Hormuz reopening drain the residual war-risk premium from
    energy. Oil and European gas fall further toward pre-war as ~20% of
    seaborne crude and ~20% of LNG renormalise and idled Gulf production
    restarts. Disinflation relief revives Fed-cut pricing, pulling front-end
    rates down and steepening; flight-to-quality unwinds so the long-end and
    USD soften and EM/petro-credit compresses. A structural floor persists
    from Qatar LNG train damage and slow field restarts, so the move is a
    glide toward pre-war rather than an overshoot below it.
  primary_risk_factors:
  - Brent Crude (CB)
  - TTF Nat Gas (TTF)
  causal_chain:
  - step: 1
    mechanism: MoU signature and blockade removal reopen Hormuz so the chokepoint premium leaves crude
    affects:
    - Brent Crude (CB)
    - WTI Crude (CL)
    - Dubai Crude (DC)
  - step: 2
    mechanism: Persian Gulf LNG transit resumes so European gas and the distillate complex fall
    affects:
    - TTF Nat Gas (TTF)
    - ICE Gasoil (QS)
    - ULSD Heating Oil (HO)
    - RBOB Gasoline (RB)
  - step: 3
    mechanism: lower energy removes the inflation tail so oil and equity vol collapse toward pre-war
    affects:
    - OVX Oil Vol (vol pts)
    - VIX (vol pts)
    - VSTOXX (vol pts)
  - step: 4
    mechanism: disinflation revives rate-cut pricing so front-end rates fall and equities rally
    affects:
    - SOFR3M (SQ)
    - S&P 500 (ES)
    - NASDAQ
    - Euro STOXX 50 (FESX)
    - DAX 40 (FDAX)
  - step: 5
    mechanism: war-risk flight-to-quality unwinds so the long-end and the dollar soften
    affects:
    - US 10Y Yield (ZN)
    - USD Index DXY
    - EUR/USD (6E)
  - step: 6
    mechanism: lower oil import bills relieve oil-importer FX while the USD haven bid fades
    affects:
    - USD/JPY (6J)
    - USD/INR (INR)
  - step: 7
    mechanism: risk-on and growth relief compress sovereign and energy-HY credit
    affects:
    - EMBI Sovereign Spread
    - HY E&P Credit Spread
  - step: 8
    mechanism: petrocurrencies net stronger on USD softness despite lower oil; energy equities lag crude down
    affects:
    - USD/NOK (NOK)
    - USD/CAD (6C)
    - S&P Energy Sector (XLE)
