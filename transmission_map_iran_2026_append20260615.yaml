iran_2026_full_escalation:
  description: >
    The MoU collapses and the US executes threatened strikes on Iranian power
    plants and energy infrastructure (Kharg) while Iran mines Hormuz and hits
    Gulf infrastructure. A hard chokepoint closure removes ~20% of seaborne
    crude and a large share of LNG, producing a disorderly oil gap-up, a global
    growth shock and a classic flight-to-quality into gold, the dollar and the
    long-end. Copper and aluminium are dragged in as the growth shock dominates
    the supply-disruption bid. Petrocurrency and safe-haven channels compete at
    the extreme, leaving NOK/CAD and USD/JPY genuinely ambiguous.
  primary_risk_factors:
  - Brent Crude (CB)
  - TTF Nat Gas (TTF)
  causal_chain:
  - step: 1
    mechanism: power-plant and Kharg strikes plus Hormuz mining shut the chokepoint and gap crude higher
