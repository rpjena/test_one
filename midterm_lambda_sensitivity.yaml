meta:
  name: us_midterm_2026_lambda_sensitivity
  anchor_date: '2026-10-01'
  election_date: '2026-11-03'
  horizon: T+1
  units: z in sigma units of today's 1-day vol (SPX 1.03%, UST10Y 6bp, DXY 0.45%, VIX 1.3pt)
  regime: reflation (expert prior, v3)
  formula: u = x(s) - lambda*E[x];  z_10y = B_10y.u + relief*r_10y;  z_i = B_i.u + relief*r_i + gamma_i*z_10y
  lambda: 'share of outcome already priced: 0 = unpriced (BofA lens), 1 = fully priced at prediction-market odds'
  relief: uncertainty-resolution vol crush, common to all outcomes
  sign_rule: z > 0.25 -> up, z < -0.25 -> down, else flat
  source_file: midterm_lambda_sensitivity.xlsx
